/* ---------- math & easing ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));

/* ---------- assets ---------- */
const IMG = {};
const TEXT_PTS = [];
async function load() {

  o.font = font(176, 600); o.letterSpacing = '-4px'; o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = '#000'; o.fillText('You just save.', W / 2, 450);

}
const font = (size, w = 500) => `${w} ${size}px "Instrument Sans", sans-serif`;

/* ---------- drawing primitives ---------- */
function text(str, x, y, size, { w = 500, color = INK, align = 'center', alpha = 1, ls = -0.02, base = 'middle' } = {}) {

function logoTile(k, x, y, s, { alpha = 1, tile = true } = {}) {
  if (alpha <= 0 || s <= 0) return;

function card(x, y, { src, title, meta, w = 300, h = 76, alpha = 1, rot = 0, scale = 1, glow = 0, accent = null } = {}) {
  if (alpha <= 0 || scale <= 0.01) return;

  if (glow > 0) { ctx.shadowColor = hexA(accent || ACCENT, 0.55 * glow); ctx.shadowBlur = 40 * glow; }
  else { ctx.shadowColor = 'rgba(20,30,60,.10)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 6; }
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 14); ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.strokeStyle = glow > 0 ? hexA(accent || ACCENT, 0.9) : LINE; ctx.lineWidth = glow > 0 ? 2.5 : 1.2; ctx.stroke();

  const lineY = meta ? -h * 0.1 : 0;

function taperPath(p0, c, p1, w0, w1, upto = 1, n = 18) {

// Watercolor soma: soft bleed, stubs, pigment pooling toward a darker rim, dark nucleus.

  ctx.save(); ctx.globalAlpha *= alpha;

  const R = rng(seed + 11);

    const p0 = [x + Math.cos(a) * r * 0.7, y + Math.sin(a) * r * 0.7], p1 = [x + Math.cos(a) * L, y + Math.sin(a) * L];

function chip(x, y, label, color, { alpha = 1, scale = 1, size = 26, logo = null, pct = null } = {}) {
  if (alpha <= 0 || scale <= 0.01) return;

  ctx.font = font(size, 500); ctx.letterSpacing = '-0.2px';

function check(x, y, s, color, k) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = s * 0.14; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

// Product logo: the edge of one group (top arc), the edge of another (bottom arc), and the line that connects them.

/* ---------- precomputed scene data ---------- */
const R0 = rng(7);

/* ---------- camera ---------- */

      card(cx0, 470, { src: 'youtube', title: 'Learn any software in 3 days', meta: 'YouTube · Watch later', w: 660, h: 150, scale: cs, alpha: clamp(cs * 2) * s6, glow: P(t, 21.1, 21.4) });
      // original untouched badge
      const b = spring(P(t, 21.35, 21.85));
      if (b > 0.01) {
        ctx.save(); ctx.globalAlpha = s6; ctx.translate(cx0 - 160, 600); ctx.scale(b, b);
        ctx.fillStyle = 'rgba(46,138,92,.1)'; ctx.beginPath(); ctx.roundRect(-150, -26, 300, 52, 26); ctx.fill();
        check(-116, 0, 26, '#2E8A5C', P(t, 21.5, 21.9)); text('Original untouched', 12, 1, 24, { color: '#2E8A5C' });
        ctx.restore();
      }
      [[GROUPS[3], 'Learning & focus', '90%', 'A method for learning fast.'], [GROUPS[0], 'AI & agents', '84%', 'Uses AI as a tutor.'], [GROUPS[1], 'Product design', '66%', 'Examples are Figma and Blender.']].forEach(([g, name, pct, why], i) => {
        const a = spring(P(t, 21.7 + i * 0.22, 22.2 + i * 0.22)); if (a <= 0.01) return;
        const y = 690 + i * 78, x = cx0 - 330;
        ctx.save(); ctx.globalAlpha = s6 * clamp(a * 2); ctx.translate((1 - a) * 60, 0);
        ctx.fillStyle = g.c; ctx.beginPath(); ctx.arc(x + 10, y, 9, 0, 7); ctx.fill();
        text(name, x + 34, y - 12, 26, { align: 'left' }); text(why, x + 34, y + 20, 21, { align: 'left', color: MUTED, w: 400 });
        const bw = 150 * eOut3(P(t, 21.9 + i * 0.22, 22.6 + i * 0.22)) * parseInt(pct) / 100;
        ctx.fillStyle = LINE; ctx.beginPath(); ctx.roundRect(x + 470, y - 16, 150, 8, 4); ctx.fill();
        ctx.fillStyle = g.c; ctx.beginPath(); ctx.roundRect(x + 470, y - 16, Math.max(1, bw), 8, 4); ctx.fill();
        text(pct, x + 640, y - 12, 22, { align: 'left', color: MUTED });
        ctx.restore();
      });
      const a = eOut3(P(t, 20.1, 20.5)) * (1 - P(t, 23.3, 23.6));
      text('See why. Trace it back.', W / 2, 150 - (1 - a) * 20, 76, { alpha: a, ls: -0.03 });
    }
    if (t > 23.8) {
      // left: kinetic lines
      ['Seven apps.', 'One résumé.', 'Every line cited.'].forEach((s, i) => {
        const a = spring(P(t, 24.05 + i * 0.3, 24.7 + i * 0.3)) * (1 - P(t, 28.2, 28.5));
        text(s, 180 + (1 - a) * -80, 380 + i * 118, 92, { align: 'left', alpha: clamp(a * 1.5), ls: -0.035, color: i === 2 ? ACCENT : INK });
      });
      // right: document with typed lines and citation chips
      const d = eOutExpo(P(t, 23.9, 24.6)) * (1 - eInBack(P(t, 28.2, 28.6)));
      const dx = 1390, dy = 560 + (1 - d) * 700;
      ctx.save(); ctx.shadowColor = 'rgba(20,30,60,.14)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 18;
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(dx - 330, dy - 390, 660, 780, 26); ctx.fill(); ctx.restore();
      ctx.save(); ctx.beginPath(); ctx.roundRect(dx - 330, dy - 390, 660, 780, 26); ctx.clip();
      text('Résumé draft', dx - 280, dy - 320, 34, { align: 'left' });
      text('Product designer · AI', dx - 280, dy - 278, 22, { align: 'left', color: MUTED });
      const rows = [[0.92, ['claude', 'reddit']], [0.8, ['claude']], [0.95, ['chatgpt']], [0.7, ['claude']], [0.86, ['gemini', 'chrome']], [0.75, ['chatgpt', 'youtube']], [0.9, ['claude', 'chatgpt', 'x']], [0.66, ['youtube']]];
      let n = 0;
      rows.forEach(([len, cites], i) => {
        const t0 = 24.7 + i * 0.36, k = eOut3(P(t, t0, t0 + 0.32)); if (k <= 0) return;
        const y = dy - 200 + i * 68, maxw = 400 * len;
        ctx.fillStyle = '#E9EDF3'; ctx.beginPath(); ctx.roundRect(dx - 280, y - 9, maxw * k, 18, 9); ctx.fill();
        cites.forEach((src, j) => { const a = spring(P(t, t0 + 0.28 + j * 0.08, t0 + 0.7 + j * 0.08)); n += a > 0.5 ? 1 : 0; logoTile(src, dx - 280 + maxw + 30 + j * 44, y, 38 * a, { alpha: clamp(a * 2) }); });
      });
      const cnt = Math.round(16 * eOut3(P(t, 27.4, 28.0)));
      text(`${cnt} sources · 7 platforms`, dx - 280, dy + 330, 26, { align: 'left', color: ACCENT, alpha: P(t, 27.3, 27.5) });
      ctx.restore();
    }
  }

  /* 8 — the context core reaches every AI (28.9–33.2) */
  const ok = eOut3(P(t, 29.5, 30.3)) * (1 - eInBack(P(t, 32.95, 33.3)));
  if (ok > 0) {
    const AIS = [['claude', 1420, 320, '#D97757'], ['chatgpt', 1540, 540, '#10A37F'], ['gemini', 1420, 760, '#5B8DEF']];
    AIS.forEach(([k, x, y, col], i) => {
      const grow = eInOut(P(t, 30.35 + i * 0.18, 31.25 + i * 0.18)) * (1 - P(t, 32.8, 33.1));
      const pts = tendril([ORB[0] + 80, ORB[1] + (y - ORB[1]) * 0.14], [x - 70, y], t, grow, (i + 1) * 0.31, col);
      if (grow >= 1 && pts.length) for (let q = 0; q < 3; q++) {
        const ph = (t * 0.75 + q / 3 + i * 0.2) % 1, pt = pts[Math.min(pts.length - 1, Math.floor(ph * pts.length))];
        const gg = ctx.createRadialGradient(pt[0], pt[1], 0, pt[0], pt[1], 16); gg.addColorStop(0, 'rgba(255,255,255,.95)'); gg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(pt[0], pt[1], 16, 0, 7); ctx.fill();
      }
      const a = spring(P(t, 30.0 + i * 0.15, 30.6 + i * 0.15)) * (1 - eInBack(P(t, 32.9, 33.25)));
      const glow = grow >= 1 ? 0.5 + 0.5 * Math.sin(t * 5 + i) : 0;
      if (glow > 0) { const hg = ctx.createRadialGradient(x, y, 0, x, y, 120); hg.addColorStop(0, hexA(col, 0.25 * glow)); hg.addColorStop(1, hexA(col, 0)); ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(x, y, 120, 0, 7); ctx.fill(); }
      logoTile(k, x, y, 128 * a, { alpha: clamp(a * 2) });
    });
    orb(t, ok);
    const ca = eOut3(P(t, 30.1, 30.6)) * (1 - P(t, 32.7, 33.0));
    text('Your context. In every AI.', W / 2, 140 - (1 - ca) * 20, 76, { alpha: ca, ls: -0.03 });
    text('One living memory, shared with the tools you already use.', W / 2, 960, 30, { alpha: P(t, 30.8, 31.2) * (1 - P(t, 32.7, 33.0)), color: MUTED, w: 400 });
  }
  /* 9 — burst back out, neurons fire (33.0–36.0) */
  inkBloom(ORB[0], ORB[1], P(t, 33.0, 34.2), t, 0.8);
  if (t > 34.0 && t < 36.2) { const a = eOut3(P(t, 34.1, 34.5)) * (1 - P(t, 35.6, 36.0)); ctx.save(); ctx.shadowColor = BG; ctx.shadowBlur = 30; text('It grows with you.', W / 2, 140 - (1 - a) * 20, 76, { alpha: a, ls: -0.03 }); ctx.restore(); }
  /* 10 — thousands of neurons gather into the words (35.9–41) */
  if (t > 35.9) {
    const parts = particles();
    for (const q of parts) {
      const u = eInOut(P(t, q.t0, q.t0 + 1.5)), dx = q.e[0] - q.s[0], dy = q.e[1] - q.s[1], L = Math.hypot(dx, dy) || 1;
      const c = [(q.s[0] + q.e[0]) / 2 - (dy / L) * q.sw, (q.s[1] + q.e[1]) / 2 + (dx / L) * q.sw];
      let [x, y] = bez(q.s, c, q.e, u);
      if (u >= 1) { x += Math.sin(t * 2 + q.ph) * 0.9; y += Math.cos(t * 1.7 + q.ph) * 0.9; }
      const a = P(t, q.t0 - 0.1, q.t0 + 0.2);
      ctx.fillStyle = hexA(q.c, 0.9 * a); ctx.beginPath(); ctx.arc(x, y, q.r * (1 + 0.8 * (1 - u) * u * 4 / 4), 0, 7); ctx.fill();
    }
    const m = eOut3(P(t, 38.25, 38.9));
    ctx.save(); mark(W / 2 - 350, 690, 96, P(t, 37.9, 38.9), t); ctx.restore();
    text('Full Context Canvas', W / 2 + 45, 690, 64, { alpha: m, ls: -0.03 });
    text('It sorts, shows you why, and connects the dots.', W / 2, 785, 32, { alpha: P(t, 38.6, 39.2), color: MUTED, w: 400 });
  }
  const fadeOut = eInOut(P(t, DURATION - 1.2, DURATION));
  if (fadeOut > 0) { ctx.fillStyle = `rgba(250,251,253,${fadeOut})`; ctx.fillRect(0, 0, W, H); }
}

window.ready = load().then(() => true);
// The first half plays ~20% slower than it was authored; everything after 15.2s of scene time is unchanged.
const SPLIT_FILM = 18.6, SPLIT_SCENE = 15.2, FILM_END = DURATION + SPLIT_FILM - SPLIT_SCENE;
const sceneTime = (T) => (T <= SPLIT_FILM ? (T * SPLIT_SCENE) / SPLIT_FILM : T - (SPLIT_FILM - SPLIT_SCENE));
window.render = (i) => { frame(sceneTime(i / FPS)); return cv.toDataURL('image/jpeg', 0.95); };
window.FILM = { FPS, DURATION: FILM_END };
</script>
