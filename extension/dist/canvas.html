<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg width="26" height="30" viewBox="20 12 80 100" aria-hidden="true"><g fill="none" stroke="#5966F1" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"><path d="M35 26Q60 35 85 26"/><path d="M35 26L85 98"/><path d="M35 98Q60 89 85 98"/></g></svg>
      <b>Full Context Canvas</b>
      <span class="tag" id="tagline"></span>
    </div>
    <span class="pill sample" id="pill-sample"></span>
    <span class="pill" id="pill-ai"><span class="dot"></span><span id="pill-ai-t"></span></span>
    <label class="search" for="q">
      <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" autocomplete="off">
      <kbd>/</kbd>
    </label>
    <div class="actions">
      <button class="btn" id="btn-tour" type="button"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg><span class="lab" id="btn-tour-t"></span></button>
      <button class="btn" id="btn-intake" type="button"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="lab" id="btn-intake-t"></span></button>
      <button class="btn primary" id="btn-import" type="button"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m0 0l-3.5-3.5M8 10l3.5-3.5M2.5 13.5h11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><span class="lab" id="btn-import-t"></span></button>
      <button class="btn ghost sm" id="btn-lang" type="button"></button>
    </div>
  </header>

  <nav class="dock" id="dock" aria-label="Sources"></nav>

  <main class="stage" id="stage">
    <div class="world" id="world">
      <svg class="blobs" id="blobs" viewBox="-4000 -4000 8000 8000" aria-hidden="true"></svg>
      <div id="hubs"></div>
      <div id="cards"></div>
      <div id="overlay"></div>
    </div>
    <div class="modes" id="modes" role="group"></div>
    <div class="tour" id="tour" hidden role="dialog" aria-live="polite"></div>
    <div class="tip" id="tip" hidden></div>
    <div class="hint" id="hint"><div id="hint-t"></div><button type="button" id="hint-x" aria-label="Close">×</button></div>
    <div class="progress" id="progress" hidden><span class="spin"></span><span id="progress-t"></span></div>
    <div class="zoom">
      <button type="button" id="z-in" aria-label="Zoom in">+</button>
      <button type="button" id="z-out" aria-label="Zoom out">−</button>
      <button type="button" id="z-fit" aria-label="Fit">⤢</button>
    </div>
    <form class="ask" id="ask" autocomplete="off">
      <div class="presets" id="presets"></div>
      <div class="bar">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l1.6 4.2 4.4.3-3.4 2.8 1.1 4.3L8 10.7l-3.7 2.4 1.1-4.3L2 6l4.4-.3z" fill="var(--accent)"/></svg>
        <input id="ask-q" type="text">
        <button class="btn primary sm" type="submit" id="ask-go"></button>
      </div>
    </form>
  </main>

  <aside class="panel" id="panel">
    <button type="button" class="prail" id="prail"></button>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="pbody" id="pbody"></div>
  </aside>

  <svg class="threads" id="threads" aria-hidden="true"></svg>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="imp-h">
    <h2 id="imp-h"></h2>
    <p class="note" id="imp-sub" style="margin:0"></p>
    <label class="drop" id="drop" for="file">
      <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0-12l-4 4m4-4l4 4M4 15v4a2 2 0 002 2h12a2 2 0 002-2v-4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <b id="drop-t"></b>
      <span class="note" id="drop-s"></span>
      <input type="file" id="file" accept=".json,.html,.htm,.txt,.csv" multiple hidden>
    </label>
    <div class="fmt" id="fmt"></div>
    <div id="imp-result"></div>
    <div class="row">
      <button class="btn ghost" type="button" id="imp-sample"></button>
      <button class="btn" type="button" id="imp-cancel"></button>
      <button class="btn primary" type="button" id="imp-go" disabled></button>
    </div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>


<script src="loader.js"></script>
</body></html>
